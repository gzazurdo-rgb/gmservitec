<!doctype html>
<html lang="es" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GM SERVICIO TÉCNICO — GM GAME</title>
<style>
:root{--bg:#07090d;--panel:#0d1118;--panel2:#111722;--line:#263142;--text:#eef3f8;--muted:#8f9aaa;--accent:#72e0a0;--accent2:#4dbdff;--danger:#e17e7e}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% -10%,#162334 0,#0a0d13 42%,#05070a 100%);color:var(--text);font:15px/1.45 "Segoe UI",system-ui,sans-serif}body{min-height:100vh}
#brand{position:relative;text-align:center;padding:20px 18px 17px;background:linear-gradient(180deg,rgba(17,23,34,.97),rgba(8,11,16,.97));border-bottom:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.28)}
#brand:after{content:"";position:absolute;left:10%;right:10%;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.7}
#brand img{width:52px;height:52px;object-fit:contain;margin:0 0 8px;border-radius:12px;vertical-align:middle;filter:drop-shadow(0 5px 15px rgba(0,0,0,.45))}
#brand b{display:block;font-size:22px;font-weight:800;letter-spacing:.12em;color:#fff}#brand small{display:block;margin-top:3px;color:#9ba8b9;font-size:11px;letter-spacing:.22em;text-transform:uppercase}
#wrap{max-width:980px;margin:0 auto;padding:22px 20px 30px}#state{font-size:25px;font-weight:800;margin:0 0 7px}#out{font-size:14px;color:#c8d0db}
#spin{width:52px;height:52px;margin:70px auto 18px;border:4px solid #202a38;border-top-color:var(--accent);border-right-color:var(--accent2);border-radius:50%;animation:spin .85s linear infinite;box-shadow:0 0 25px rgba(114,224,160,.12)}
#msg{text-align:center;font-size:16px;color:#dce5ee;letter-spacing:.3px}
#cache{font-size:12px;color:#657183;margin-top:8px}.ok,.safe{color:var(--accent)}.bad,.danger{color:var(--danger)}.warn{color:#e2c978}code{color:#a8c5e5}
.business{max-width:980px;margin:0 auto;padding:0 20px 22px}.business-card{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:14px 17px;border:1px solid #202a37;border-radius:14px;background:rgba(13,17,24,.86);box-shadow:0 12px 35px rgba(0,0,0,.22)}.business-name{font-weight:800;letter-spacing:.08em}.business-data{margin-top:3px;color:var(--muted);font-size:12px}.business-social{text-align:right;color:#b9c5d2;font-size:12px}.business-social strong{color:var(--accent)}
@media(max-width:600px){#brand{padding:16px 12px 14px}#brand b{font-size:18px}.business-card{display:block}.business-social{text-align:left;margin-top:8px}#wrap{padding:18px 14px 24px}.business{padding:0 14px 18px}}
</style>
</head>
<body>
<div id="brand"><img src="logo_raw.png" alt="GM"><b>GM SERVICIO TÉCNICO</b><small>GM GAME • PS4 SERVICE</small></div>
<div id="spin"></div>
<div id="msg">Iniciando servicio…</div>
<div id="wrap"><div id="state"></div><div id="out"></div></div>
<div class="business"><div class="business-card"><div><div class="business-name">GM SERVICIO TÉCNICO</div><div class="business-data">Carril Chimbas- 400 · Palmira · Mendoza</div></div><div class="business-social"><strong>WhatsApp 2634557596</strong><br>@gm.servitec</div></div></div>
<script type="module">import "./jb.js?v=19";</script>
</body>
</html>
