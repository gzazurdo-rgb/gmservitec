<style>
:root{--bg:#05030b;--panel:rgba(7,8,18,.78);--panel2:rgba(10,12,25,.84);--line:rgba(92,132,255,.28);--text:#f4f7ff;--muted:#aab4c9;--accent:#54d8ff;--accent2:#6b4dff;--danger:#ff6b7a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#03030a;color:var(--text);font:15px/1.45 "Segoe UI",system-ui,sans-serif}body{min-height:100vh;position:relative;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-4;background:#03030a url("gm_gamer_bg.jpg") center center/cover no-repeat;filter:saturate(1.05) contrast(1.04);transform:scale(1.015)}
body:after{content:"";position:fixed;inset:0;z-index:-3;background:radial-gradient(circle at 50% 42%,rgba(27,20,86,.18),rgba(0,0,0,.72) 72%),linear-gradient(180deg,rgba(0,0,0,.40),rgba(0,0,0,.76));pointer-events:none}
.screen-watermark{position:fixed;inset:0;z-index:0;pointer-events:none;display:flex;align-items:flex-end;justify-content:center;padding:0 15px 28px;opacity:.82}
.screen-watermark-card{display:flex;align-items:center;gap:12px;padding:9px 15px;border:1px solid rgba(84,216,255,.20);border-radius:14px;background:rgba(3,5,14,.58);box-shadow:0 10px 35px rgba(0,0,0,.28)}
.screen-watermark img{width:38px;height:38px;object-fit:contain;border-radius:8px}.screen-watermark-text{font-size:10px;line-height:1.45;color:#d9e3f5;text-align:left}.screen-watermark-text b{display:block;color:#fff;font-size:11px;letter-spacing:.08em}.screen-watermark-text strong{color:#54d8ff}
#brand{position:relative;z-index:1;text-align:center;padding:20px 18px 17px;background:rgba(5,7,17,.88);border-bottom:1px solid var(--line);box-shadow:0 8px 30px rgba(0,0,0,.38);backdrop-filter:blur(5px)}
#brand:after{content:"";position:absolute;left:10%;right:10%;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--accent),var(--accent2),transparent);opacity:.8}
#brand img{width:52px;height:52px;object-fit:contain;margin:0 0 8px;border-radius:12px;vertical-align:middle;filter:drop-shadow(0 5px 15px rgba(0,0,0,.55))}
#brand b{display:block;font-size:22px;font-weight:800;letter-spacing:.12em;color:#fff}#brand small{display:block;margin-top:3px;color:#aebbd0;font-size:11px;letter-spacing:.22em;text-transform:uppercase}
#wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:22px 20px 30px}#state{font-size:25px;font-weight:800;margin:0 0 7px;text-shadow:0 2px 15px #000}#out{font-size:14px;color:#d7dfec}
#spin{position:relative;z-index:1;width:52px;height:52px;margin:70px auto 18px;border:4px solid #202a38;border-top-color:var(--accent);border-right-color:var(--accent2);border-radius:50%;animation:spin .85s linear infinite;box-shadow:0 0 25px rgba(84,216,255,.18)}
#msg{position:relative;z-index:1;text-align:center;font-size:16px;color:#e8effa;letter-spacing:.3px;text-shadow:0 2px 12px #000}
#cache{font-size:12px;color:#8895ab;margin-top:8px}.ok,.safe{color:#65e8a4}.bad,.danger{color:var(--danger)}.warn{color:#e7cf72}code{color:#b9d7ff}
.business{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:0 20px 22px}.business-card{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:14px 17px;border:1px solid rgba(84,216,255,.24);border-radius:14px;background:rgba(5,8,18,.78);box-shadow:0 12px 35px rgba(0,0,0,.38);backdrop-filter:blur(7px)}.business-name{font-weight:800;letter-spacing:.08em}.business-data{margin-top:3px;color:#aebbd0;font-size:12px}.business-social{text-align:right;color:#c5d0e1;font-size:12px}.business-social strong{color:#54d8ff}
@media(max-width:600px){#brand{padding:16px 12px 14px}#brand b{font-size:18px}.business-card{display:block}.business-social{text-align:left;margin-top:8px}#wrap{padding:18px 14px 24px}.screen-watermark{padding-bottom:18px}.screen-watermark-card{max-width:94vw}.screen-watermark-text{font-size:9px}}
</style>
