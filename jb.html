<!doctype html>
<html lang="es" manifest="cache.appcache">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GM SERVICIO TÉCNICO — GM GAME</title>
<style>
:root{--bg:#05070b;--panel:#0b1018;--line:rgba(255,255,255,.10);--text:#f5f8fc;--muted:#9ca9ba;--green:#63e6a0;--blue:#45bfff}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#05070b;color:var(--text);font:15px/1.45 "Segoe UI",system-ui,sans-serif}body{overflow:hidden}
#loading{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 35%,rgba(69,191,255,.13),transparent 25%),radial-gradient(circle at 50% 70%,rgba(99,230,160,.10),transparent 30%),linear-gradient(135deg,#030508 0%,#09111b 50%,#030508 100%);transition:opacity .5s ease}
#loading:before,#loading:after{content:"";position:absolute;border-radius:50%;pointer-events:none}#loading:before{width:65vw;height:65vw;border:1px solid rgba(69,191,255,.12);animation:pulse 3s ease-in-out infinite}#loading:after{width:95vw;height:95vw;border:1px solid rgba(99,230,160,.07);animation:pulse 4s ease-in-out infinite reverse}
.grid{position:absolute;inset:-30%;opacity:.13;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:42px 42px;transform:perspective(500px) rotateX(62deg) translateY(20%);animation:gridmove 8s linear infinite}
.loading-card{position:relative;z-index:2;width:min(92vw,620px);padding:42px 28px 34px;text-align:center;border:1px solid rgba(255,255,255,.12);border-radius:28px;background:rgba(7,11,17,.72);backdrop-filter:blur(18px);box-shadow:0 30px 100px rgba(0,0,0,.55),0 0 70px rgba(69,191,255,.08)}
.logo-ring{width:112px;height:112px;margin:0 auto 22px;border-radius:28px;padding:3px;background:conic-gradient(from 0deg,var(--green),var(--blue),var(--green));animation:ring 3s linear infinite;box-shadow:0 0 45px rgba(69,191,255,.18)}.logo-box{width:100%;height:100%;display:grid;place-items:center;border-radius:25px;background:#070b11}.logo-box img{width:76px;height:76px;object-fit:contain;border-radius:16px}
.kicker{font-size:11px;letter-spacing:.34em;color:var(--green);font-weight:800;margin-bottom:8px}h1{margin:0;font-size:clamp(25px,6vw,42px);letter-spacing:.10em;font-weight:900}.subtitle{margin:8px 0 25px;color:#aab7c7;font-size:13px;letter-spacing:.20em}.business{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:0 auto 28px}.business span{padding:9px 13px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.035);color:#dce5ee;font-size:12px}.business strong{color:var(--green)}
.loader{width:min(100%,390px);height:5px;margin:0 auto 14px;border-radius:99px;background:#17212d;overflow:hidden}.loader i{display:block;width:42%;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green),var(--blue),var(--green));animation:load 1.35s ease-in-out infinite}#msg{margin:0;color:#dbe5ee;font-size:13px;letter-spacing:.08em}
#brand{text-align:center;padding:18px 12px 16px;background:rgba(8,11,16,.96);border-bottom:1px solid var(--line)}#brand img{width:48px;height:48px;object-fit:contain;margin-bottom:7px;border-radius:11px}#brand b{display:block;font-size:20px;font-weight:800;letter-spacing:.12em}#brand small{display:block;color:#9ba8b9;font-size:10px;letter-spacing:.2em;margin-top:2px}
#spin{position:fixed;top:50%;left:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border:4px solid #202a38;border-top-color:var(--green);border-right-color:var(--blue);border-radius:50%;animation:spin .85s linear infinite}#msg-old{position:fixed;top:calc(50% + 54px);left:15px;right:15px;text-align:center;font-size:15px;color:#dce5ee}.ok,.safe{color:var(--green)}.bad,.danger{color:#e17e7e}.warn{color:#e2c978}code{color:#a8c5e5}
body.done #spin,body.fail #spin{display:none}body.fail #msg-old{display:block;color:#e17e7e;font-weight:700}body.done #msg-old{display:block;color:var(--green);font-weight:800;letter-spacing:1.5px}body.log #spin,body.log #msg-old,body.log #loading{display:none}body.log #wrap{display:block;padding:18px 20px;max-width:980px;margin:auto}body.log #state{display:block;font-size:24px;font-weight:800;margin:0 0 10px}body.log #out{display:block;white-space:pre-wrap;font:12px/1.5 Consolas,monospace;background:rgba(13,17,24,.95);border:1px solid var(--line);border-radius:12px;padding:14px;height:calc(100vh - 125px);overflow-y:auto;box-shadow:0 12px 35px rgba(0,0,0,.3)}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes ring{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.05);opacity:.55}}@keyframes gridmove{to{transform:perspective(500px) rotateX(62deg) translateY(80px)}}@keyframes load{0%{transform:translateX(-130%)}100%{transform:translateX(330%)}}
@media(max-width:600px){.loading-card{padding:32px 18px 28px;border-radius:22px}.logo-ring{width:92px;height:92px;border-radius:23px}.logo-box{border-radius:20px}.logo-box img{width:64px;height:64px}.business{gap:7px}.business span{font-size:11px;padding:8px 10px}body.log #wrap{padding:14px}body.log #out{height:calc(100vh - 116px)}}
</style></head>
<body>
<div id="loading"><div class="grid"></div><div class="loading-card"><div class="logo-ring"><div class="logo-box"><img src="logo_raw.png" alt="GM SERVICIO TÉCNICO"></div></div><div class="kicker">GM SERVICIO TÉCNICO</div><h1>GM GAME</h1><div class="subtitle">PS4 SERVICE • TECNOLOGÍA • SOPORTE</div><div class="business"><span>📱 <strong>2634557596</strong> · WhatsApp</span><span>📍 Carril Chimbas-400 · Palmira</span><span>📸 @gm.servitec</span><span>🌐 gmserviciotecnico.com</span></div><div class="loader"><i></i></div><div id="msg">Iniciando servicio…</div></div></div>
<div id="brand"><img src="logo_raw.png" alt="GM"><b>GM SERVICIO TÉCNICO</b><small>GM GAME • PS4 SERVICE</small></div><div id="spin"></div><div id="msg-old">Iniciando servicio…</div><div id="wrap"><div id="state"></div><div id="out"></div></div>
<script type="module">import "./jb.js?v=19";</script>
<script>window.addEventListener("load",function(){setTimeout(function(){var l=document.getElementById("loading");if(l)l.style.opacity="0";setTimeout(function(){if(l)l.style.display="none"},500)},1800)});</script>
</body></html>
